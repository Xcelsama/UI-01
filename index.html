<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <header class="main">
 <section class="greeting-card d-flex p-2 justify-content-start align-items-center">
<img class=" ms-2 avatar rounded  img-fluid" src="avatar.jpg" >
<div class="d-flex flex-column justify-content-center">
<p class="avatar-text">Good Morning!</p>
<h5 class="avatar-text">Sajibur Rahman</h5>
</div>
<div class="btn-greeting ms-auto"> <i class="bi bi-search"></i></div>
<div class="btn-greeting"> <i class="bi bi-bell"></i></div>
 </section>
<section class="balance-card d-grid">
    <div>
    <p class="mb-0">Total Balance</p>
    <h2 class="acctbal">$56,893.30</h2>
    <p class="mb-0 est" >+$3,456.00 <span class="percent">8.98%</span></p>
    </div>
    <div class="align-items-center ms-auto"> <i class=" eye bi bi-eye btn-greeting"></i></div>
</section>
<section class="d-flex action-card ms-auto me-auto justify-content-center align-items-center">
<button class="btn-1"><i class="bi bi-plus-lg"></i> <span></span>Deposit</button>
<button class="btn-2"><i class="bi bi-arrow-down-up"></i> <span>Transfer</span></button>
<button class="btn-3">⠿</button>
</section>
</header>
<main>
    <div class="content-panel">
        <section class="d-grid d-cd">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">My Cards</h5>
                <span class="add-card"><i class="bi bi-plus"></i> Add</span>
            </div>
            <div class="card-row">
            <img src="card01.png" class="img-card">
            <img src="card02.png" class="img-card">
            </div>
        </section>

        <section class="upcm d-flex justify-content-between align-items-center p-3">
            <div class="d-flex align-items-center">
                <i class="bi bi-megaphone-fill me-2"></i>
                <div>
                    <p class="upcm-title">Upcoming Payment</p>
                    <small>6 Dec, 2025 &nbsp; $450</small>
                </div>
            </div>
            <button class="pay-action">Pay Now</button>
        </section>

        <section class="transactions">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">Transactions</h5>
                <a href="transaction.html" class="see-more">See More</a>
            </div>
            <div class="transaction-row d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="tx-icon">
<i class="fa-brands fa-upwork"></i>
</i></div>
                    <div class="ms-2">
                        <p>Upwork</p>
                        <small class="sp">Client Payment Received</small>
                    </div>
                </div>
                <span class="tx-amount">+$480.00</span>
            </div>
        </section>
    </div>
</main>
</body>
</html>
